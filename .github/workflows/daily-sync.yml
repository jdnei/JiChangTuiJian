name: Daily Date Update & Sync to Gitee and GitLab

on:
  schedule:
    - cron: '26 19 * * *'
  workflow_dispatch:

jobs:
  update-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Date and Fix Image Links
        run: |
          Y=$(TZ='Asia/Shanghai' date +'%Y')
          M=$(TZ='Asia/Shanghai' date +'%-m')
          D=$(TZ='Asia/Shanghai' date +'%-d')
          CURRENT_DATE="${Y}年${M}月${D}日"

          case "$M" in
            1) EN_MONTH="January"; RU_MONTH="января"; FA_MONTH="ژانویه" ;;
            2) EN_MONTH="February"; RU_MONTH="февраля"; FA_MONTH="فوریه" ;;
            3) EN_MONTH="March"; RU_MONTH="марта"; FA_MONTH="مارس" ;;
            4) EN_MONTH="April"; RU_MONTH="апреля"; FA_MONTH="آوریل" ;;
            5) EN_MONTH="May"; RU_MONTH="мая"; FA_MONTH="مه" ;;
            6) EN_MONTH="June"; RU_MONTH="июня"; FA_MONTH="ژوئن" ;;
            7) EN_MONTH="July"; RU_MONTH="июля"; FA_MONTH="ژوئیه" ;;
            8) EN_MONTH="August"; RU_MONTH="августа"; FA_MONTH="اوت" ;;
            9) EN_MONTH="September"; RU_MONTH="сентября"; FA_MONTH="سپتامبر" ;;
            10) EN_MONTH="October"; RU_MONTH="октября"; FA_MONTH="اکتبر" ;;
            11) EN_MONTH="November"; RU_MONTH="ноября"; FA_MONTH="نوامبر" ;;
            12) EN_MONTH="December"; RU_MONTH="декабря"; FA_MONTH="دسامبر" ;;
          esac

          EN_DATE="Updated ${EN_MONTH} ${D}, ${Y}"
          RU_DATE="Обновлено ${D} ${RU_MONTH} ${Y} года"
          FA_DATE="به‌روزرسانی ${D} ${FA_MONTH} ${Y}"

          for file in *.md; do
            [ -f "$file" ] || continue
            sed -i -E "s/\([0-9]{4}年[0-9]{1,2}月[0-9]{1,2}日更新\)/(${CURRENT_DATE}更新)/g" "$file"
            sed -i -E "s/\(Updated [A-Za-z]+ [0-9]{1,2}, [0-9]{4}\)/(${EN_DATE})/g" "$file"
            sed -i -E "s/\(Обновлено [0-9]{1,2} [^)]+ [0-9]{4} года\)/(${RU_DATE})/g" "$file"
            sed -i -E "s/\(به‌روزرسانی [0-9]{1,2} [^)]+ [0-9]{4}\)/(${FA_DATE})/g" "$file"
          done

          sed -i 's/\(\.png\|\.jpg\|\.jpeg\|\.gif\))/\1?raw=true)/g' README.md
          sed -i 's/?raw=true?raw=true/?raw=true/g' README.md

      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- '*.md'
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update date" && git push)

      - name: Force Push to Gitee
        run: |
          git push --force https://jdnei:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ github.repository }}.git HEAD:${GITHUB_REF_NAME}

      - name: Force Push to GitLab
        run: |
          git push --force https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/jdnei/${{ github.event.repository.name }}.git HEAD:${GITHUB_REF_NAME}
