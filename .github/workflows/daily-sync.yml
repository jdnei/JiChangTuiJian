name: Daily Date Update & Sync to Gitee and GitLab

on:
  schedule:
    - cron: '26 19 * * *'
  workflow_dispatch:

jobs:
  update-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Date and Fix Image Links
        run: |
          Y=$(TZ='Asia/Shanghai' date +'%Y')
          M=$(TZ='Asia/Shanghai' date +'%-m')
          D=$(TZ='Asia/Shanghai' date +'%-d')
          CURRENT_DATE="${Y}年${M}月${D}日"

          case "$M" in
            1) RU_MONTH="января" ;;
            2) RU_MONTH="февраля" ;;
            3) RU_MONTH="марта" ;;
            4) RU_MONTH="апреля" ;;
            5) RU_MONTH="мая" ;;
            6) RU_MONTH="июня" ;;
            7) RU_MONTH="июля" ;;
            8) RU_MONTH="августа" ;;
            9) RU_MONTH="сентября" ;;
            10) RU_MONTH="октября" ;;
            11) RU_MONTH="ноября" ;;
            12) RU_MONTH="декабря" ;;
          esac
          RU_DATE="Обновлено ${D} ${RU_MONTH} ${Y} года"

          case "$M" in
            1) FA_MONTH="ژانویه" ;;
            2) FA_MONTH="فوریه" ;;
            3) FA_MONTH="مارس" ;;
            4) FA_MONTH="آوریل" ;;
            5) FA_MONTH="مه" ;;
            6) FA_MONTH="ژوئن" ;;
            7) FA_MONTH="ژوئیه" ;;
            8) FA_MONTH="اوت" ;;
            9) FA_MONTH="سپتامبر" ;;
            10) FA_MONTH="اکتبر" ;;
            11) FA_MONTH="نوامبر" ;;
            12) FA_MONTH="دسامبر" ;;
          esac
          FA_DATE="به‌روزرسانی ${D} ${FA_MONTH} ${Y}"

          for file in *.md; do
            [ -f "$file" ] || continue
            sed -i -E "s/\([0-9]{4}年[0-9]{1,2}月[0-9]{1,2}日更新\)/(${CURRENT_DATE}更新)/g" "$file"
            sed -i -E "s/\(Обновлено [0-9]{1,2} [^)]+ [0-9]{4} года\)/(${RU_DATE})/g" "$file"
            sed -i -E "s/\(به‌روزرسانی [0-9]{1,2} [^)]+ [0-9]{4}\)/(${FA_DATE})/g" "$file"
          done

          sed -i 's/\(\.png\|\.jpg\|\.jpeg\|\.gif\))/\1?raw=true)/g' README.md
          sed -i 's/?raw=true?raw=true/?raw=true/g' README.md

      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- '*.md'
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update date" && git push)

      - name: Force Push to Gitee
        run: |
          git push --force https://jdnei:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ github.repository }}.git HEAD:${GITHUB_REF_NAME}

      - name: Force Push to GitLab
        run: |
          git push --force https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/jdnei/${{ github.event.repository.name }}.git HEAD:${GITHUB_REF_NAME}
